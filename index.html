<script>'use strict';
// Lógica de cuentas (sin pantalla). Se puede probar sola.
(function (root) {
  const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;

  // "1.234,56" -> 1234.56
  function parseAR(s) {
    if (typeof s === 'number') return r2(s);
    let t = String(s == null ? '' : s).trim().replace(/\s/g, '');
    if (!t) return 0;
    let neg = false;
    if (t[0] === '-') { neg = true; t = t.slice(1); }
    t = t.replace(/\./g, '').replace(',', '.');
    const n = parseFloat(t);
    if (isNaN(n)) return NaN;
    return r2(neg ? -n : n);
  }

  // 1234.56 -> "1.234,56"
  function fmtAR(n) {
    const v = r2(n);
    const neg = v < 0;
    const [ent, dec] = Math.abs(v).toFixed(2).split('.');
    return (neg ? '-' : '') + ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + dec;
  }

  const KEYS = ['compra', 'efectivo1', 'efectivo2', 'mercadopago', 'transferencia', 'ajuste'];

  // Cuánto cambia el saldo en un día: compra - pagos + ajuste
  function mov(t) {
    if (!t) return 0;
    return r2((t.compra || 0) - (t.efectivo1 || 0) - (t.efectivo2 || 0) -
      (t.mercadopago || 0) - (t.transferencia || 0) + (t.ajuste || 0));
  }

  // Saldo de un cliente hasta una fecha (incluida o no)
  function saldoHasta(db, cid, fecha, incluir) {
    const c = db.clients.find((x) => x.id === cid);
    let s = c ? Number(c.saldoInicial) || 0 : 0;
    for (const d of Object.keys(db.allTxns)) {
      if (d > fecha || (!incluir && d === fecha)) continue;
      s += mov(db.allTxns[d][cid]);
    }
    return r2(s);
  }

  function totalesDia(db, fecha) {
    const out = { compras: 0, efectivo1: 0, efectivo2: 0, mercadopago: 0, transferencia: 0, ajuste: 0 };
    const d = db.allTxns[fecha] || {};
    for (const cid of Object.keys(d)) {
      if (cid === '__meta__') continue;
      for (const k of KEYS) out[k === 'compra' ? 'compras' : k] += d[cid][k] || 0;
    }
    for (const k of Object.keys(out)) out[k] = r2(out[k]);
    return out;
  }

  // ---- Arqueo ----
  // dg = efectivo cobrado - depositado general - retiro NF ; d1/d2 = efectivo del cobrador - lo que depositó
  // (positivo = falta depositar, negativo = sobra)
  function arqueoDia(db, f, rec) {
    rec = rec || (db.arqueo && db.arqueo[f]) || {};
    const t = totalesDia(db, f);
    return {
      t,
      dg: r2(t.efectivo1 + t.efectivo2 - (rec.depositadoGeneral || 0) - (rec.retiroNF || 0)),
      d1: r2(t.efectivo1 - (rec.depositado1 || 0)),
      d2: r2(t.efectivo2 - (rec.depositado2 || 0))
    };
  }
  function arqueoAcum(db, f, incluir) {
    const b = db.baseSemana || {};
    const out = { g: Number(b.arqueo) || 0, c1: Number(b.arqueo1) || 0, c2: Number(b.arqueo2) || 0 };
    for (const d of Object.keys(db.arqueo || {})) {
      if (d > f || (!incluir && d === f)) continue;
      const x = arqueoDia(db, d);
      out.g += x.dg; out.c1 += x.d1; out.c2 += x.d2;
    }
    return { g: r2(out.g), c1: r2(out.c1), c2: r2(out.c2) };
  }

  // ---- Logística ----
  // dif = (efectivo + MP + transferencia de ayer + corrección) - pagos afectados
  function difLog(rec) {
    rec = rec || {};
    return r2((rec.efectivoAyer || 0) + (rec.mercadopagoAyer || 0) + (rec.transferenciaAyer || 0) + (rec.correccion || 0) - (rec.pagosAfectado || 0));
  }
  function logAcum(db, f, incluir) {
    let s = Number((db.baseSemana || {}).logistica) || 0;
    for (const d of Object.keys(db.logisticaTxns || {})) {
      if (d > f || (!incluir && d === f)) continue;
      s += difLog(db.logisticaTxns[d]);
    }
    return r2(s);
  }
  const prevDate = (keys, f) => keys.filter((d) => d < f).sort().pop() || null;
  function sugLogistica(db, f) {
    const pt = prevDate(Object.keys(db.allTxns || {}).filter((d) => Object.keys(db.allTxns[d]).some((k) => k !== '__meta__')), f);
    const pa = prevDate(Object.keys(db.arqueo || {}), f);
    const t = pt ? totalesDia(db, pt) : { mercadopago: 0, transferencia: 0 };
    return { efectivoAyer: pa ? r2(db.arqueo[pa].depositadoGeneral || 0) : 0, mercadopagoAyer: t.mercadopago, transferenciaAyer: t.transferencia, fechaCobro: pt, fechaArqueo: pa };
  }

  // ---- Limpieza de historial viejo ----
  // Todo lo anterior al día de corte se borra. Antes se calcula la "foto" (saldos y acumulados)
  // y se guarda como punto de partida; recién después se borran los días viejos.
  function resumenCorte(db, corte) {
    const antes = (o) => Object.keys(o || {}).filter((d) => d < corte).sort();
    const t = antes(db.allTxns), a = antes(db.arqueo), l = antes(db.logisticaTxns);
    const todos = Array.from(new Set(t.concat(a, l))).sort();
    const quedan = Array.from(new Set(Object.keys(db.allTxns || {}).concat(Object.keys(db.arqueo || {}), Object.keys(db.logisticaTxns || {})).filter((d) => d >= corte))).length;
    return { borrar: todos.length, desde: todos[0] || null, hasta: todos[todos.length - 1] || null, quedan,
      arq: arqueoAcum(db, corte, false), log: logAcum(db, corte, false) };
  }
  function limpiarAntes(db, corte) {
    const saldos = db.clients.map((c) => [c, saldoHasta(db, c.id, corte, false)]);
    const ar = arqueoAcum(db, corte, false), lg = logAcum(db, corte, false);
    saldos.forEach(([c, s]) => { c.saldoInicial = s; c.saldoDesde = corte; });
    db.baseSemana = Object.assign({}, db.baseSemana, { desde: corte, arqueo: ar.g, arqueo1: ar.c1, arqueo2: ar.c2, logistica: lg, cerradaEl: new Date().toISOString() });
    for (const k of ['allTxns', 'arqueo', 'logisticaTxns']) for (const d of Object.keys(db[k] || {})) if (d < corte) delete db[k][d];
    if (db.undo && db.undo.fecha < corte) delete db.undo;
    return db;
  }

  // ---- Pasar datos entre celulares ----
  const tieneDatos = (t) => !!t && KEYS.some((k) => (t[k] || 0) !== 0);
  const iguales = (a, b) => KEYS.every((k) => r2((a || {})[k] || 0) === r2((b || {})[k] || 0));
  const IGUALES_AR = ['depositadoGeneral', 'depositado1', 'depositado2', 'retiroNF'];
  const IGUALES_LG = ['efectivoAyer', 'mercadopagoAyer', 'transferenciaAyer', 'pagosAfectado', 'correccion'];
  const mismo = (a, b, ks) => ks.every((k) => r2((a || {})[k] || 0) === r2((b || {})[k] || 0));
  const algo = (o, ks) => !!o && ks.some((k) => (o[k] || 0) !== 0);

  // Lo que manda el empleado: lo cargado ese día.
  function armarCierre(db, f, de) {
    const dia = {}, nombres = {};
    const d = (db.allTxns || {})[f] || {};
    for (const cid of Object.keys(d)) {
      if (cid === '__meta__' || !tieneDatos(d[cid])) continue;
      dia[cid] = {}; KEYS.forEach((k) => { dia[cid][k] = d[cid][k] || 0; });
      const c = db.clients.find((x) => x.id === cid); nombres[cid] = c ? c.name : cid;
    }
    const ar = (db.arqueo || {})[f], lg = (db.logisticaTxns || {})[f];
    return { tipo: 'cierre-r284', version: 1, fecha: f, de: de || '', creadoEl: new Date().toISOString(), dia, nombres,
      arqueo: algo(ar, IGUALES_AR) ? ar : null, logistica: algo(lg, IGUALES_LG) ? lg : null };
  }

  // Suma el cierre del empleado a los datos del titular. Si ya había algo distinto, manda el titular.
  function sumarCierre(db, c, aplicar) {
    const f = c.fecha, r = { agregados: [], completados: [], iguales: [], conflictos: [], desconocidos: [], arqueo: '', logistica: '' };
    const dia = (db.allTxns || {})[f] || {};
    for (const cid of Object.keys(c.dia || {})) {
      const nom = (c.nombres || {})[cid] || cid;
      if (!db.clients.some((x) => x.id === cid)) { r.desconocidos.push(nom); continue; }
      const ya = dia[cid];
      if (!tieneDatos(ya)) { r.agregados.push(nom); if (aplicar) { if (!db.allTxns[f]) db.allTxns[f] = {}; db.allTxns[f][cid] = KEYS.reduce((o, k) => { o[k] = c.dia[cid][k] || 0; return o; }, {}); } }
      else if (iguales(ya, c.dia[cid])) r.iguales.push(nom);
      else if (KEYS.some((k) => ya[k] && c.dia[cid][k] && r2(ya[k]) !== r2(c.dia[cid][k]))) r.conflictos.push(nom);
      else if (KEYS.some((k) => !ya[k] && c.dia[cid][k])) { r.completados.push(nom); if (aplicar) KEYS.forEach((k) => { if (!ya[k]) ya[k] = c.dia[cid][k] || 0; }); }
      else r.iguales.push(nom);
    }
    if (aplicar && (r.agregados.length || r.completados.length)) { const m = db.allTxns[f].__meta__; db.allTxns[f].__meta__ = m || { editadoPor: c.de, actualizadoEl: new Date().toISOString(), guardado: false }; }
    const trat = (k, ks, nombre) => {
      const nuevo = c[nombre === 'arqueo' ? 'arqueo' : 'logistica']; if (!nuevo) return;
      const ya = (db[k] || {})[f];
      if (!algo(ya, ks)) { r[nombre] = 'agregado'; if (aplicar) db[k][f] = Object.assign({}, nuevo, { editadoPor: nuevo.editadoPor || c.de, guardado: false }); }
      else if (mismo(ya, nuevo, ks)) r[nombre] = 'igual';
      else if (ks.some((x) => ya[x] && nuevo[x] && r2(ya[x]) !== r2(nuevo[x]))) r[nombre] = 'conflicto';
      else if (ks.some((x) => !ya[x] && nuevo[x])) { r[nombre] = 'completado'; if (aplicar) ks.forEach((x) => { if (!ya[x]) ya[x] = nuevo[x] || 0; }); }
      else r[nombre] = 'igual';
    };
    trat('arqueo', IGUALES_AR, 'arqueo'); trat('logisticaTxns', IGUALES_LG, 'logistica');
    return r;
  }

  // Cargas de este celular que no están en un archivo del titular (para no perderlas al recibir saldos)
  function cargasSinEnviar(db, o) {
    let n = 0;
    for (const f of Object.keys(db.allTxns || {})) for (const cid of Object.keys(db.allTxns[f])) {
      if (cid === '__meta__' || !tieneDatos(db.allTxns[f][cid])) continue;
      const otro = ((o.allTxns || {})[f] || {})[cid];
      if (!iguales(db.allTxns[f][cid], otro)) n++;
    }

  async function llamarLector(imagenes, prompt) {
    const c = lectorCfg(); if (!c) throw new Error('Falta configurar el lector (Más → Lector de fotos).');
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 90000);
    let r;
    try { r = await fetch(c.url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-App-Token': c.clave }, body: JSON.stringify({ imagenes, prompt }), signal: ctl.signal }); }
    catch (e) { throw new Error(e && e.name === 'AbortError' ? 'Tardó demasiado. Probá de nuevo.' : 'No hay internet o el lector no responde.'); }
    finally { clearTimeout(to); }
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok || !j.texto) throw new Error(j.error || 'El lector devolvió un error (' + r.status + ').');

  function achicarFoto(file) {
    return new Promise((ok, mal) => {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const M = 1800, k = Math.min(1, M / Math.max(im.width, im.height)), cv = document.createElement('canvas');
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
        ok(cv.toDataURL('image/jpeg', 0.85).split(',')[1]);
      };
      im.onerror = () => { URL.revokeObjectURL(url); mal(new Error('No se pudo abrir la foto.')); };
      im.src = url;
    });
  }

<div class="rline"><span>Clientes que se actualizan</span><b>${r.n}</b></div>

${filas || '<div class="empty">No se encontró ningún teléfono ni mail.</div>'}</div>
<div class="foot"><button class="btn ghost" data-a="cm-atras" style="flex:1">ATRÁS</button><button class="btn green" data-a="cm-aplicar" style="flex:1.4${r.sin || !r.n ? ';opacity:.4' : ''}"${r.sin || !r.n ? ' disabled' : ''}>ACTUALIZAR CLIENTES</button></div>` + nav();

  // ---------- PIN ----------
  async function pinDone() {
    const name = S.name.trim();
    if (S.stage === 'crear') { S.first = S.buf; S.buf = ''; S.stage = 'confirmar'; S.msg = ''; return render(); }
    if (S.stage === 'confirmar') {
      if (S.buf !== S.first) { S.buf = ''; S.first = ''; S.stage = 'crear'; S.msg = 'No coinciden. Elegí el PIN de nuevo.'; return render(); }
      if (!name) { S.buf = ''; S.first = ''; S.stage = 'crear'; S.msg = 'Escribí tu nombre o iniciales y empezá de nuevo.'; return render(); }
      DB.config.pinHash = await hashPin(S.buf);
      persist(); S.logged = true; S.buf = ''; S.first = ''; S.msg = ''; S.stage = 'entrar'; return render();
    }
    if (!name) { S.buf = ''; S.msg = 'Escribí tu nombre o iniciales.'; return render(); }
    const ok = (await hashPin(S.buf)) === DB.config.pinHash;
    S.buf = '';
    if (!ok) { S.msg = 'PIN incorrecto.'; return render(); }
    S.logged = true; S.msg = ''; render();
  }

  // ---------- Respaldo ----------
  function bajar(nombre, blob) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  // Para mandar por WhatsApp/mail si el celular deja; si no, se baja a Descargas.
  async function entregar(nombre, blob, aviso) {
    try {
      const f = new File([blob], nombre, { type: blob.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: nombre }); toast('Listo, enviado.', 3000); return true; }
    } catch (e) { if (e && e.name === 'AbortError') { toast('Se canceló el envío.', 3000); return false; } }
    bajar(nombre, blob); toast(aviso || 'Archivo guardado en Descargas.', 4500); return true;
  }
  const datosCompletos = () => ({ exportedAt: new Date().toISOString(), clients: DB.clients, allTxns: DB.allTxns, arqueo: DB.arqueo, logisticaTxns: DB.logisticaTxns, baseSemana: DB.baseSemana, notas: DB.notas });
  function marcarRespaldo() {
    DB.config.respaldo = Date.now();
    try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {}
  }
  function respaldoPendiente() {
    const c = DB.config, r = c.respaldo || 0;
    if (!c.cambio || !DB.clients.length) return null;
    if (r && ymd(new Date(r)) === today()) return null;
    if (r && c.cambio <= r) return null;
    return r;
  }
  function respaldoBanner() {
    const r = respaldoPendiente(); if (r === null) return '';
    const cuando = r ? 'Último respaldo: ' + fechaCorta(ymd(new Date(r))) + '.' : 'Todavía no hiciste ningún respaldo.';
    return `<div style="padding:8px 12px 0"><div class="banner" style="background:#FDE7E5;border-color:#B3261E;color:#8C1D18"><b>⚠️ Respaldo pendiente.</b> ${cuando} Si se pierde el celular se pierde todo.<br><button class="btn red sm" data-a="resp-ya" style="margin-top:8px;width:100%">RESPALDAR AHORA (Drive, WhatsApp…)</button></div></div>`;
  }
  async function respaldoRapido() {
    const ok = await entregar('respaldo-cuenta-corriente-' + today() + '.json', new Blob([JSON.stringify(datosCompletos(), null, 2)], { type: 'application/json' }), 'Respaldo guardado en Descargas. Subilo a tu Drive.');
    if (ok) { marcarRespaldo(); render(); }
  }
  function hacerRespaldo() {
    marcarRespaldo();
    if (!S.rJ && !S.rX) return toast('Elegí al menos un archivo.', 3000);
    let demora = 0;
    if (S.rJ) { bajar('respaldo-cuenta-corriente-' + today() + '.json', new Blob([JSON.stringify(datosCompletos(), null, 2)], { type: 'application/json' })); demora = 700; }
    if (S.rX) setTimeout(() => bajar('planilla-cuenta-corriente-' + today() + '.xlsx', new Blob([root.R284X.makeXlsx(L.filasExcel(DB))], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })), demora);
    toast('Respaldo hecho. Buscalo en Descargas.', 3500);
  }

  function leerArchivo(file) {
    const r = new FileReader();
    r.onerror = () => toast('No se pudo leer el archivo. No se cambió nada.', 4000);
    r.onload = () => {
      let o;
      try { o = JSON.parse(r.result); } catch (e) { return toast('Ese archivo no es un respaldo válido. No se cambió nada.', 4500); }
      if (!o || !Array.isArray(o.clients) || typeof o.allTxns !== 'object' || !o.allTxns) return toast('Ese archivo no parece un respaldo. No se cambió nada.', 4500);
      const dias = Object.keys(o.allTxns).length;
      const sin = L.cargasSinEnviar(DB, o);
      const aviso = sin ? `<br><br><b style="color:#B3261E">Ojo: este celular tiene ${sin} cargas que NO están en el archivo y se perderían.</b>` : '';
      S.modal = {
        title: '¿Restaurar este respaldo?', ok: 'RESTAURAR', danger: true,
        text: `Trae <b>${o.clients.length} clientes</b> y <b>${dias} días</b>${o.exportedAt ? ' (hecho el ' + esc(o.exportedAt.slice(0, 10)) + ')' : ''}.<br><br><b>Reemplaza todo lo que hay ahora en este celular.</b>${aviso}`,
        onOk: () => {
          DB = Object.assign(blank(), { clients: o.clients, allTxns: o.allTxns, arqueo: o.arqueo || {}, logisticaTxns: o.logisticaTxns || {}, baseSemana: o.baseSemana || blank().baseSemana, notas: o.notas || [], config: DB.config });
          if (persist()) toast('Respaldo efectuado', 3000);
        }
      };
      render();
    };
    r.readAsText(file);
  }

  // ---------- Arqueo ----------
  const fv = (n) => (n ? L.fmtAR(n) : '');
  const inp = (id, lab, val, attr, extra) => `<label class="f">${lab}<input type="text" inputmode="decimal" id="${id}" ${attr} placeholder="0,00" value="${val}" ${extra || ''} class="${val ? 'has' : ''}"></label>`;
  function difBadge(n, pos, neg) {
    if (Math.abs(n) < 0.005) return '<span class="bdg okb">Cierra</span>';
    return `<span class="bdg warn">${n > 0 ? pos : neg} ${L.fmtAR(Math.abs(n))}</span>`;
  }
  function resLine(label, id, n, pos, neg, big) {
    return `<div class="rline${big ? ' big' : ''}"><span>${label}</span><span id="${id}">${difBadge(n, pos, neg)}</span></div>`;
  }
  function arVals() {
    const g = (id) => { const e = document.getElementById(id); const n = e ? L.parseAR(e.value) : 0; return isNaN(n) ? 0 : n; };
    return { depositadoGeneral: g('ar-gen'), depositado1: g('ar-d1'), depositado2: g('ar-d2'), retiroNF: g('ar-nf') };
  }
  function arCalc() {
    const rec = arVals(), x = L.arqueoDia(DB, S.fecha, rec), p = L.arqueoAcum(DB, S.fecha, false);
    const set = (id, h) => { const e = document.getElementById(id); if (e) e.innerHTML = h; };
    set('ar-rdg', difBadge(x.dg, 'Faltan', 'Sobran')); set('ar-rag', difBadge(L.r2(p.g + x.dg), 'Faltan', 'Sobran'));
    set('ar-rd1', difBadge(x.d1, 'Faltan', 'Sobran')); set('ar-ra1', difBadge(L.r2(p.c1 + x.d1), 'Faltan', 'Sobran'));
    set('ar-rd2', difBadge(x.d2, 'Faltan', 'Sobran')); set('ar-ra2', difBadge(L.r2(p.c2 + x.d2), 'Faltan', 'Sobran'));
  }
  function detalleArqueoHTML() {
    const r = L.detalleArqueo(DB);
    if (!r.length) return '<p>Todavía no hay arqueos guardados.</p>';
    return '<table class="dtab"><tr><th>Día</th><th>Cobrado</th><th>Deposit.</th><th>Dif.</th><th>Acum.</th></tr>' + r.map((x) =>
      `<tr><td>${esc(x.fecha.slice(8, 10) + '/' + x.fecha.slice(5, 7))}</td><td>${L.fmtAR(x.cobrado)}</td><td>${L.fmtAR(x.depositado)}</td><td>${L.fmtAR(x.dif)}</td><td><b>${L.fmtAR(x.acum)}</b></td></tr>`).join('') + '</table><p style="margin:8px 0 0">Cobrado = efectivo COB 1 + COB 2. Deposit. = general + retiro NF. Para encontrar una diferencia, compará esta lista con la de tu app anterior.</p>';
  }
  function viewArqueo() {
    const f = S.fecha, rec = DB.arqueo[f] || {}, t = L.totalesDia(DB, f);
    const x = L.arqueoDia(DB, f), p = L.arqueoAcum(DB, f, false);
    const line = (l, v) => `<div class="rline"><span>${l}</span><b>${L.fmtAR(v)}</b></div>`;
    const R = (l, id, n, big) => `<div class="rline${big ? ' big' : ''}"><span>${l}</span><span id="${id}">${difBadge(n, 'Faltan', 'Sobran')}</span></div>`;
    const lk = recBloq(DB.arqueo[f]);
    const html = header('Arqueo', true) + `<div class="body">${lk ? bannerBloq(DB.arqueo[f], 'adestr') : ''}
<section class="card sec"><h2>Cobrador 1</h2>${line('Cobrado', t.efectivo1)}
${inp('ar-d1', 'Depositado', fv(rec.depositado1), 'data-arq="1"')}
${R('Diferencia', 'ar-rd1', x.d1)}${R('Acumulado', 'ar-ra1', L.r2(p.c1 + x.d1))}</section>
<section class="card sec"><h2>Cobrador 2</h2>${line('Cobrado', t.efectivo2)}
${inp('ar-d2', 'Depositado', fv(rec.depositado2), 'data-arq="1"')}
${R('Diferencia', 'ar-rd2', x.d2)}${R('Acumulado', 'ar-ra2', L.r2(p.c2 + x.d2))}</section>
<section class="card sec"><h2>Retiro y depósito general</h2><div class="grid2">
${inp('ar-nf', 'Retiro', fv(rec.retiroNF), 'data-arq="1"')}${inp('ar-gen', 'Depositado general', fv(rec.depositadoGeneral), 'data-arq="gen"', rec.depositadoGeneral != null && DB.arqueo[f] ? 'data-touched="1"' : '')}
</div><p style="margin:10px 0 0">El general se completa solo (COB 1 + COB 2 − retiro). Si el banco te dio otro número, escribilo.</p></section>
<section class="card res">${R('Total diferencia del día', 'ar-rdg', x.dg, true)}${R('Total acumulado', 'ar-rag', L.r2(p.g + x.dg), true)}
<p style="margin:8px 0 0;font-size:12px;color:#55625F">"Faltan" = se cobró más de lo que se depositó. "Sobran" = se depositó de más.</p></section>
<details class="card sec det"><summary>Ver el acumulado día por día</summary>${detalleArqueoHTML()}</details></div>
<div class="foot">${lk ? '<button class="btn ghost" data-a="adestr" style="flex:1">🔒 DESTRABAR ARQUEO</button>' : '<button class="btn green" data-a="asave" style="flex:1">GUARDAR ARQUEO</button>'}</div>` + nav();
    return lk ? html.replace(/ data-arq=/g, ' disabled data-arq=') : html;
  }
  // Cuando están guardados los 3 pasos del día (Cierre, Arqueo y Logística) se ofrece el respaldo.
  function preguntarRespaldo() {
    const f = S.fecha;
    if (!diaBloqueado(f) || !recBloq(DB.arqueo[f]) || !recBloq(DB.logisticaTxns[f])) return;
    S.modal = { title: 'Día completo guardado', ok: 'HACER RESPALDO', cancel: 'MÁS TARDE',
      text: `Ya guardaste Cierre, Arqueo y Logística del <b>${esc(fechaLarga(f))}</b>.<br><br>¿Hacés el respaldo ahora?`, onOk: hacerRespaldo };
    render();
  }
  function guardarArqueo() {
    const ids = ['ar-d1', 'ar-d2', 'ar-nf', 'ar-gen'];
    if (ids.some((i) => isNaN(L.parseAR(document.getElementById(i).value)))) return toast('Hay un número que no es válido.', 3000);
    const v = arVals();
    DB.arqueo[S.fecha] = Object.assign(v, { editadoPor: S.name, actualizadoEl: new Date().toISOString(), guardado: true });
    if (persist()) { toast('Arqueo guardado y bloqueado'); render(); preguntarRespaldo(); }
  }

  // ---------- Logística ----------
  function lgVals() {
    const g = (id) => { const e = document.getElementById(id); const n = e ? L.parseAR(e.value) : 0; return isNaN(n) ? 0 : n; };
    return { efectivoAyer: g('lg-ef'), mercadopagoAyer: g('lg-mp'), transferenciaAyer: g('lg-tr'), pagosAfectado: g('lg-pa'), correccion: g('lg-co') };
  }
  function lgCalc() {
    const d = L.difLog(lgVals()), a = L.logAcum(DB, S.fecha, false);
    const set = (id, h) => { const e = document.getElementById(id); if (e) e.innerHTML = h; };
    set('lg-rd', difBadge(d, 'Falta acreditar', 'Acreditó de más')); set('lg-ra', difBadge(L.r2(a + d), 'Falta acreditar', 'Acreditó de más'));

    } else {
      S.modal = { title: 'PIN de titular', text: 'Escribí el PIN de titular.', ok: 'ENTRAR', pin: 1,

  const PAGOS = ['compra', 'efectivo1', 'efectivo2', 'mercadopago', 'transferencia'];

    const day = DB.allTxns[S.fecha] || {};
    const n = Object.keys(day).filter((k) => k !== '__meta__' && PAGOS.some((p) => day[k][p])).length;
    if (!n) return toast('No hay compras ni pagos cargados en ese día.', 3000);
    S.modal = { title: '¿Limpiar el día?', ok: 'LIMPIAR', danger: true,
      text: `Se borran las compras y pagos de <b>${n} clientes</b> del <b>${esc(fechaLarga(S.fecha))}</b>. Los ajustes no se tocan.<br><br>Antes se guarda una copia, por si querés deshacer.`,

        const dd = DB.allTxns[S.fecha];
        DB.undo = { fecha: S.fecha, day: JSON.parse(JSON.stringify(dd)), at: new Date().toISOString(), por: S.name };
        for (const id of Object.keys(dd)) {
          if (id === '__meta__') continue;
          PAGOS.forEach((p) => { dd[id][p] = 0; });

    }
    else if (a === 'pg-atras') { S.pegar.paso = 'texto'; render(); }
    else if (a === 'pg-aplicar') pgAplicar();
    else if (a === 'solo') { S.solo = !S.solo; render(); }
    else if (a === 'todos') { S.todos = !S.todos; try { localStorage.setItem('r284.todos', S.todos ? '1' : '0'); } catch (e) {} S.open = null; render(); }
    else if (a === 'open') { S.open = v; refreshList(); const el = document.querySelector('.card.open'); if (el) el.scrollIntoView({ block: 'nearest' }); }
    else if (a === 'close') { S.open = null; refreshList(); }
    else if (a === 'guardar') {
      const day = DB.allTxns[S.fecha];
      if (!day || Object.keys(day).filter((k) => k !== '__meta__').length === 0) return toast('No hay nada cargado en este día.');
      day.__meta__ = { editadoPor: S.name, actualizadoEl: new Date().toISOString(), guardado: true };
      S.open = null; if (persist()) { toast('Día guardado y bloqueado'); render(); preguntarRespaldo(); }
    }
    else if (a === 'respaldo') hacerRespaldo();
    else if (a === 'resp-ya') respaldoRapido();
    else if (a === 'restaurar') { const f = document.getElementById('file'); if (f) { f.value = ''; f.click(); } }
    else if (a === 'm-no') { S.modal = null; render(); }
    else if (a === 'm-ok') okModal();
    else if (a === 'menu') {
      if (v === 'limpiar') requirePin(confirmLimpiar);
      else if (v === 'undo') confirmUndo();
      else if (v === 'historial') { S.sub = 'historial'; S.selCli = null; S.hq = ''; render(); }
      else if (v === 'clientes') requirePin(() => { S.sub = 'clientes'; S.hq = ''; render(); });
      else if (v === 'notas') { S.sub = 'notas'; render(); }
      else if (v === 'resumen') requirePin(() => { S.sub = 'resumen'; S.rdia = S.fecha; render(); });
      else if (v === 'retiros') requirePin(() => { S.sub = 'retiros'; S.rmes = today().slice(0, 7); render(); }, true);
      else if (v === 'pasar') { S.sub = 'pasar'; render(); }
      else if (v === 'archivar') requirePin(() => { S.sub = 'archivar'; S.arcOk = false; S.corte = null; render(); });
      else if (v === 'lector') { S.pegar = null; S.sub = 'lector'; render(); }
      else if (v === 'respaldo') requirePin(() => { S.sub = 'respaldo'; render(); });
    }
    else if (a === 'cm-abrir') { S.cmas = { paso: 'texto', texto: '' }; S.sub = 'cmasivo'; render(); }
    else if (a === 'cm-planilla') entregar('clientes-contactos.csv', new Blob([L.csvContactos(DB)], { type: 'text/csv' }), 'Planilla guardada en Descargas.');
    else if (a === 'cm-pegar') {
      (navigator.clipboard && navigator.clipboard.readText ? navigator.clipboard.readText() : Promise.reject()).then((t) => { S.cmas.texto = t; render(); }, () => toast('No se pudo leer. Mantené apretado en el cuadro y elegí Pegar.', 4000));
    }
    else if (a === 'cm-leer') {
      const e = document.getElementById('cm-txt'); if (e) S.cmas.texto = e.value;
      const lista = L.armarContactos(DB, S.cmas.texto);
      if (!lista.filas.length) return toast('No encontré teléfonos ni mails. Revisá el texto pegado.', 4000);
      S.cmas.lista = lista; S.cmas.paso = 'revisar'; render();
    }
    else if (a === 'cm-atras') { S.cmas.paso = 'texto'; render(); }
    else if (a === 'cm-aplicar') {
      const Ls = S.cmas.lista, r = cmResumen(Ls); if (r.sin) return toast('Faltan clientes por identificar.', 3000);
      S.modal = { title: '¿Actualizar clientes?', ok: 'OK, ACTUALIZAR', cancel: 'ATRÁS',
        text: `Se actualizan <b>${r.n} clientes</b>: ${r.tel} teléfonos y ${r.mail} mails. Lo que ya tenían cargado y no viene en la lista no se borra.`,
        onOk: () => { const c = L.aplicarContactos(DB, Ls); if (persist()) toast('Listo: ' + c.tel + ' teléfonos y ' + c.mail + ' mails cargados.', 4500); S.cmas = null; S.sub = 'clientes'; } };
      render();
    }
    else if (a === 'subback' && S.sub === 'cmasivo') { if (S.cmas && S.cmas.paso === 'revisar') S.cmas.paso = 'texto'; else { S.cmas = null; S.sub = 'clientes'; } render(); }
    else if (a === 'subback' && S.pegar) { if (S.pegar.paso === 'revisar') S.pegar.paso = 'texto'; else S.pegar = null; render(); }
    else if (a === 'subback') { if (S.sub === 'cform') { S.sub = 'clientes'; S.edit = null; } else if (S.sub === 'historial' && S.selCli) S.selCli = null; else S.sub = null; render(); }
    else if (a === 'hsel') { S.selCli = v; render(); }
    else if (a === 'cnew') { S.edit = 'nuevo'; S.sub = 'cform'; render(); }
    else if (a === 'cedit') { S.edit = v; S.sub = 'cform'; render(); }
    else if (a === 'cinact') { S.verInact = !S.verInact; render(); }
    else if (a === 'csave') guardarCliente();
    else if (a === 'ctoggle') { const c = DB.clients.find((x) => x.id === S.edit); if (c) { c.active = c.active === false; if (persist()) { toast(c.active ? 'Cliente activado' : 'Cliente desactivado'); S.sub = 'clientes'; S.edit = null; render(); } } }
    else if (a === 'rdia') { S.rdia = shiftDay(S.rdia || S.fecha, Number(v)); render(); }
    else if (a === 'rmes') { const [y, m] = (S.rmes || today().slice(0, 7)).split('-').map(Number); const d = new Date(y, m - 1 + Number(v), 1); S.rmes = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); render(); }
    else if (a === 'r-desc') bajar('resumen-' + S.rdia + '.txt', new Blob([L.textoResumen(DB, S.rdia)], { type: 'text/plain' }));
    else if (a === 'r-comp') compartirTexto(L.textoResumen(DB, S.rdia));
    else if (a === 'p-pin') requirePin(() => render());
    else if (a === 'p-enviar') enviarCierre();
    else if (a === 'p-saldos') enviarSaldos();
    else if (a === 'arc-resp') { hacerRespaldo(); S.arcOk = true; render(); }
    else if (a === 'arc-ir') confirmArchivar();
    else if (a === 'asave') guardarArqueo();
    else if (a === 'lsave') guardarLogistica();
    else if (a === 'nsave') { const el = document.getElementById('n-text'); const tx = el.value.trim(); if (!tx) return toast('Escribí la nota primero.'); DB.notas.push({ fecha: today(), texto: tx, usuario: S.name }); if (persist()) { toast('Nota guardada'); render(); } }
  });

  app.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'name') { S.name = t.value; localStorage.setItem(NAMEKEY, S.name); }
    else if (t.id === 'q') { S.q = t.value; refreshList(); }
    else if (t.dataset && t.dataset.arq) {
      if (t.dataset.arq === 'gen') t.dataset.touched = '1';
      else {
        const gen = document.getElementById('ar-gen');
        if (gen && !gen.dataset.touched) { const v = arVals(); const n = L.r2(v.depositado1 + v.depositado2 - v.retiroNF); gen.value = n ? L.fmtAR(n) : ''; }
      }
      arCalc();
    }
    else if (t.dataset && t.dataset.lg) lgCalc();
    else if (t.id === 'hq') { S.hq = t.value; const l = document.getElementById('list2'); if (l) l.innerHTML = S.sub === 'clientes' ? cliListHTML() : histListHTML(); }
  });

  app.addEventListener('change', (e) => {
    const t = e.target;
    if (t.dataset && t.dataset.pgsel != null && S.pegar) {
      const x = S.pegar.lista.filas[Number(t.dataset.pgsel)], val = t.value;
      if (!val) { render(); return; }
      if (val === '__omitir') { x.estado = 'omitir'; render(); return; }
      const cl = DB.clients.find((c) => c.id === val);
      S.modal = { title: 'Eligió a ' + cl.name, ok: 'OK', cancel: 'ATRÁS', text: `La línea <b>${esc(x.nombre)}</b> (${L.fmtAR(x.monto)}) se carga a <b>${esc(cl.name)}</b>.`,
        onOk: () => { x.id = val; x.estado = 'manual'; } };
      render(); return;
    }
    if (t.dataset && t.dataset.cmsel != null && S.cmas) {
      const x = S.cmas.lista.filas[Number(t.dataset.cmsel)], val = t.value;
      if (!val) { render(); return; }
      if (val === '__omitir') { x.estado = 'omitir'; render(); return; }
      const cl = DB.clients.find((c) => c.id === val);
      S.modal = { title: 'Eligió a ' + cl.name, ok: 'OK', cancel: 'ATRÁS', text: `La línea <b>${esc(x.nombre)}</b> se carga a <b>${esc(cl.name)}</b>.`, onOk: () => { x.id = val; x.estado = 'manual'; } };
      render(); return;
    }
    if (t.dataset && t.dataset.pgm != null && S.pegar && S.pegar.lista) {
      const n = L.parseAR(t.value); if (isNaN(n) || t.value.trim() === '') { toast('Monto no válido.', 2500); render(); return; }
      S.pegar.lista.filas[Number(t.dataset.pgm)].monto = n; render(); return;
    }
    if (t.id === 'pg-exp' && S.pegar) { const n = L.parseAR(t.value); S.pegar.totalEsperado = isNaN(n) || t.value.trim() === '' ? null : n; render(); return; }
    if (t.id === 'file' && t.files && t.files[0]) return leerArchivo(t.files[0]);
    if (t.id === 'pg-foto' && t.files && t.files.length && S.pegar) return pgFotoAgregar(t.files);
    if (t.dataset && t.dataset.opt) { S[t.dataset.opt] = t.checked; return; }
    if (t.id === 'file-c' && t.files && t.files[0]) return leerCierre(t.files[0]);
    if (t.id === 'file-s' && t.files && t.files[0]) return leerSaldos(t.files[0]);
    if (t.id === 'arc-corte') { if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)) { S.corte = t.value; render(); } return; }
    if (t.dataset && (t.dataset.arq || t.dataset.lg)) { const n = L.parseAR(t.value); if (isNaN(n)) { toast('Ese número no es válido.'); } else { t.value = n ? L.fmtAR(n) : ''; t.classList.toggle('has', !!n); } return; }
    if (t.dataset && t.dataset.k) {
      if (diaBloqueado(S.fecha)) return toast('El día está guardado. Destrabalo con el PIN de titular.', 3500);
      const n = L.parseAR(t.value);
      const t0 = getT(S.fecha, t.dataset.id);
      if (isNaN(n)) { toast('Ese número no es válido.'); t.value = t0 && t0[t.dataset.k] ? L.fmtAR(t0[t.dataset.k]) : ''; return; }
      setVal(S.fecha, t.dataset.id, t.dataset.k, n);
      t.value = n ? L.fmtAR(n) : '';
      t.classList.toggle('has', !!n);
      const antes = L.saldoHasta(DB, t.dataset.id, S.fecha, false);
      const nuevo = L.r2(antes + L.mov(getT(S.fecha, t.dataset.id)));
      const el = document.getElementById('new-' + t.dataset.id);
      if (el) { el.textContent = L.fmtAR(nuevo); el.className = 'b ' + cls(nuevo); }
      const tt = dayTotals();
      const setT = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = L.fmtAR(v); };
      setT('tot-compras', tt.compras); setT('tot-efectivo', L.r2(tt.efectivo1 + tt.efectivo2)); setT('tot-mp', tt.mercadopago); setT('tot-transf', tt.transferencia);
    }
  });

  // Si la app quedó abierta de un día para el otro, pasa sola al día de hoy.
  hoyVisto = today();
  function revisarDia() {
    const h = today(); if (h === hoyVisto) return;
    if (S.fecha === hoyVisto) S.fecha = h;
    hoyVisto = h; S.open = null; if (!S.modal) render();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) revisarDia(); });
  window.addEventListener('focus', revisarDia);
  setInterval(revisarDia, 30000);

  render();
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
